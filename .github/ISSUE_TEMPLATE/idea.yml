name: I have an idea
description: Something the planner could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like the planner to do?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What would it help with?
  - type: textarea
    id: details
    attributes:
      label: Setup
      description: Filled in by the planner's Feedback button.
      render: text
